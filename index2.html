<style>
:root{
  --board:#F2EEE6;   /* planed pale oak */
  --card:#FBF9F4;
  --ink:#2A2119;     /* seasoned oak */
  --faded:#7A6E5F;
  --grain:#DCD3C4;   /* rules */
  --fox:#B4512E;     /* accent — Foxtail nod */
  --moss:#4A5A3A;    /* done */
  --moss-soft:#E4E8DC;
  --fox-soft:#F3E1D7;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
}
body{
  background:var(--board);
  color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size:15.5px;line-height:1.45;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
}
.display{font-family:"Bricolage Grotesque", -apple-system, sans-serif}
.mono{font-family:"IBM Plex Mono", ui-monospace, monospace}

/* ---------- header ---------- */
header{
  background:var(--ink);color:var(--board);
  padding:calc(18px + env(safe-area-inset-top)) 20px 18px;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.peg-logo{width:26px;height:26px;border-radius:50%;background:var(--fox);position:relative;flex:none}
.peg-logo::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--board)}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-0.02em}
.brand h1 span{color:var(--fox)}
.goalline{font-size:12.5px;color:#B9AE9E;letter-spacing:.01em}
.goalline b{color:var(--board);font-weight:600}
.overall{margin-top:16px}
.overall .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.overall .pct{font-size:30px;font-weight:600;line-height:1}
.overall .count{font-size:12px;color:#B9AE9E}
.kerf{height:7px;background:#463A2D;border-radius:99px;overflow:hidden}
.kerf i{display:block;height:100%;width:0%;background:var(--fox);border-radius:99px;transition:width .45s cubic-bezier(.2,.7,.3,1)}
.savestate{margin-top:9px;font-size:11px;color:#8E8272}
.savestate.warn{color:#E0A184}

/* ---------- phase nav ---------- */
nav{
  position:sticky;top:0;z-index:20;background:var(--board);
  display:flex;gap:8px;overflow-x:auto;padding:12px 20px;
  border-bottom:1px solid var(--grain);
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid var(--grain);background:var(--card);color:var(--ink);
  border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:7px;cursor:pointer;
}
.chip small{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:10.5px;color:var(--faded)}
.chip.done{background:var(--moss-soft);border-color:#C4CDB4}
.chip.done small{color:var(--moss)}
.chip.current{background:var(--ink);color:var(--board);border-color:var(--ink)}
.chip.current small{color:var(--fox)}

/* ---------- phases ---------- */
main{padding:18px 16px 0;max-width:640px;margin:0 auto}
.phase{
  background:var(--card);border:1px solid var(--grain);border-radius:16px;
  margin-bottom:16px;overflow:hidden;
}
.phase-head{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:16px 16px 14px;display:block;color:inherit;font:inherit}
.stamp{
  display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.08em;color:var(--fox);border:1px solid currentColor;border-radius:4px;
  padding:2px 7px;margin-bottom:8px;
}
.phase.complete .stamp{color:var(--moss)}
.phase-head h2{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:700;letter-spacing:-0.015em;line-height:1.2}
.phase-head .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.phase-head .when{font-size:12.5px;color:var(--faded)}
.phase-head .mini{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faded)}
.phase .kerf{background:var(--grain);height:5px;margin:12px 16px 0;border-radius:99px}
.phase .kerf i{background:var(--moss)}
.phase-body{display:none;padding:4px 16px 16px}
.phase.open .phase-body{display:block}
.phase-note{font-size:13px;color:var(--faded);font-style:italic;margin:6px 0 12px}

/* tasks */
.task{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:none;border:none;border-top:1px solid var(--grain);
  padding:12px 2px;cursor:pointer;color:inherit;font:inherit;
}
.task:first-of-type{border-top:none}
.peg{
  flex:none;width:24px;height:24px;border-radius:50%;
  border:2px solid #B7AC99;background:transparent;margin-top:1px;position:relative;
  transition:background .18s, border-color .18s, transform .18s;
}
.peg::after{
  content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card);
  opacity:0;transition:opacity .18s;
}
.task.checked .peg{background:var(--moss);border-color:var(--moss);transform:scale(1.05)}
.task.checked .peg::after{opacity:1}
.task .txt{flex:1}
.task .txt p{font-size:14.5px;line-height:1.4}
.task.checked .txt p{color:var(--faded);text-decoration:line-through;text-decoration-color:#B7AC99;text-decoration-thickness:1px}
.tags{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.05em;border-radius:4px;padding:2px 6px;background:var(--board);color:var(--faded);border:1px solid var(--grain)}
.tag.owner{color:var(--fox);border-color:#E0C4B4;background:var(--fox-soft)}
.tag.claude{color:#4E5A6E;border-color:#C8CEDA;background:#E8EBF1}
.tag.both{color:var(--moss);border-color:#C4CDB4;background:var(--moss-soft)}

/* gate */
.gate{
  margin-top:14px;border:1.5px dashed #B7AC99;border-radius:12px;padding:12px 14px;background:var(--board);
}
.gate .glabel{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--faded);margin-bottom:5px}
.gate p{font-size:13.5px;line-height:1.45}
.gate .task{border:none;padding:10px 0 0}
.gate .task .txt p{font-weight:600;font-size:13.5px}
.gate.passed{border-color:var(--moss);border-style:solid;background:var(--moss-soft)}
.gate.passed .glabel{color:var(--moss)}

/* ---------- reference sections ---------- */
.ref{background:var(--card);border:1px solid var(--grain);border-radius:16px;margin-bottom:16px;overflow:hidden}
.ref-head{width:100%;text-align:left;background:none;border:none;cursor:pointer;color:inherit;font:inherit;padding:15px 16px;display:flex;justify-content:space-between;align-items:center}
.ref-head h3{font-family:"Bricolage Grotesque",sans-serif;font-size:16px;font-weight:700;letter-spacing:-0.01em}
.ref-head .arrow{color:var(--faded);transition:transform .2s;font-size:13px}
.ref.open .arrow{transform:rotate(90deg)}
.ref-body{display:none;padding:0 16px 16px;font-size:14px}
.ref.open .ref-body{display:block}
.ref-body dt{font-weight:650;margin-top:11px}
.ref-body dd{color:var(--faded);margin-top:2px}
.budget-line{display:flex;justify-content:space-between;border-top:1px solid var(--grain);padding:9px 0;font-size:13.5px}
.budget-line:first-child{border-top:none}
.budget-line .mono{color:var(--faded);font-size:12.5px}
.budget-line.total{font-weight:700}
.budget-line.total .mono{color:var(--ink)}
.foot{max-width:640px;margin:4px auto 0;padding:0 16px;text-align:center;font-size:11.5px;color:var(--faded)}
button:focus-visible,.task:focus-visible{outline:2px solid var(--fox);outline-offset:2px;border-radius:8px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="peg-logo" aria-hidden="true"></div>
    <div>
      <h1 class="display">Oak <span>Launch</span> Plan</h1>
      <div class="goalline">Goal <b>£250k profit / yr</b> · Revenue <b>£850k–£1.2m</b> · Engine: outdoor kitchens</div>
    </div>
  </div>
  <div class="overall">
    <div class="row">
      <span class="pct display" id="overallPct">0%</span>
      <span class="count mono" id="overallCount">0 / 0 tasks</span>
    </div>
    <div class="kerf"><i id="overallBar"></i></div>
    <div class="savestate" id="saveState">Loading…</div>
  </div>
</header>

<nav id="phaseNav" aria-label="Phases"></nav>
<main id="app"></main>

<section class="foot">Estimates marked (est.) are Claude's — replace with real quotes. Gates must pass before the next phase spends money.</section>

<script>
const PLAN = [
  {
    id:"p0", stamp:"PHASE 0", title:"Inputs & Foundations", when:"Weeks 1–2",
    note:"Nothing here costs money. Everything after this depends on it.",
    tasks:[
      {id:"t01",who:"owner",text:"Stock list: every finished piece — dimensions, timber spec, finish, build cost, hours"},
      {id:"t02",who:"owner",text:"Build economics: one representative table + the largest past build (cost, carpenter-days)"},
      {id:"t03",who:"owner",text:"Count contactable Foxtail clients & live enquiries (with consent status)"},
      {id:"t04",who:"owner",text:"Carpenter capacity: realistic spare days/week alongside the framing pipeline"},
      {id:"t05",who:"both",text:"Accountant brief: new entity vs trade within Foxtail; VAT position (moves consumer pricing 20%)"},
      {id:"t06",who:"both",text:"Insurance check: furniture retail + public liability on installs"},
      {id:"t07",who:"both",text:"Brand decision: Foxtail sub-brand vs new name — options paper, then decide"},
      {id:"t08",who:"both",text:"Choose the signature design detail (one joint / edge / leg profile on every piece)"}
    ],
    gate:{id:"g0",text:"Real numbers in hand, structure question asked, brand direction chosen. Buy and build nothing before this."}
  },
  {
    id:"p1", stamp:"PHASE 1", title:"Sell the Stock, Prove Demand", when:"Weeks 2–6",
    note:"The stock sale IS the market research. Real buyers at real prices beat any survey.",
    tasks:[
      {id:"t11",who:"claude",text:"Price every stock piece from build cost + market comparables"},
      {id:"t12",who:"owner",cost:"£600–1,200 est.",text:"One-day photo shoot: all stock + workshop + carpenters at work (shot list prepared)"},
      {id:"t13",who:"claude",text:"Listings for every piece: title, copy, spec, care, delivery terms"},
      {id:"t14",who:"both",cost:"£100–300 est.",text:"Channels live: Vinterior/Etsy + Instagram + one-page site with enquiry form"},
      {id:"t15",who:"owner",text:"Delivery solved before first sale: quotes from two 2-person couriers; price-in vs charge-on"},
      {id:"t16",who:"both",text:"Past-client email #1: “we make furniture now — clients get first pick”"},
      {id:"t17",who:"claude",text:"Terms of sale drafted (stock = 14-day distance-selling cancellation applies) → professional review"}
    ],
    gate:{id:"g1",text:"≥3 pieces sold at target margin, delivery executed undamaged, measurable warm-list response. If stock won't sell at target prices, find out why before spending on brand."}
  },
  {
    id:"p2", stamp:"PHASE 2", title:"Brand, Website, Kitchen Range", when:"Weeks 6–12",
    note:"Spend on brand now — funded, ideally, by Phase 1 cash.",
    tasks:[
      {id:"t21",who:"both",cost:"£300–800 est.",text:"Execute brand: name, logo, tone — type-led, freelancer polish, no agency"},
      {id:"t22",who:"both",text:"Name the collections (kitchens + furniture) before anything else is photographed"},
      {id:"t23",who:"both",text:"Design the kitchen range on paper: 3 named configurations, modular component logic"},
      {id:"t24",who:"claude",text:"Cost model per configuration: materials, carpenter-days, appliances, install → price floor"},
      {id:"t25",who:"both",text:"Appliance supply: shortlist outdoor-rated suppliers, open trade accounts"},
      {id:"t26",who:"both",cost:"£400–700 est.",text:"Website v1 on Shopify: kitchens enquiry-only (no prices), furniture buyable, workshop story"},
      {id:"t27",who:"claude",text:"Kitchen quote & proposal template: drawings, spec, 50% deposit, bespoke-exemption wording → review"},
      {id:"t28",who:"claude",text:"Past-client email #2: kitchen range + design consultations; founding-client priority, not discount"}
    ],
    gate:{id:"g2",text:"Site live, range priced at ≥40% gross margin from real costs, ≥5 design consultations booked from the warm list. If a warm list won't book, fix the proposition before approaching strangers."}
  },
  {
    id:"p3", stamp:"PHASE 3", title:"First Installs & Case Studies", when:"Months 3–6",
    note:"The first three kitchens are marketing assets that happen to be profitable.",
    tasks:[
      {id:"t31",who:"owner",text:"Sell & deliver first 2–3 kitchen projects at full price — priority is the incentive, never discounts"},
      {id:"t32",who:"owner",cost:"£400–800/install est.",text:"Photograph every install: same photographer, golden hour, people cooking in shot"},
      {id:"t33",who:"claude",text:"Case study per install: client story, spec, images — the Huckleberry playbook"},
      {id:"t34",who:"claude",text:"Trade list: 50 garden designers, landscape architects, high-end landscapers, named contacts"},
      {id:"t35",who:"both",cost:"£100 est.",text:"Trade outreach: personal letter + printed case study → 10 conversations, 3 relationships, 10–15% trade terms"},
      {id:"t36",who:"claude",text:"Press kit: images, founder story, the structure-plus-kitchen differentiator → garden & county press"},
      {id:"t37",who:"claude",text:"Google Business Profile + local SEO + first 4 SEO pages"},
      {id:"t38",who:"both",text:"Monthly numbers review begins: revenue, margin per job, pipeline, carpenter-days"}
    ],
    gate:{id:"g3",text:"3 installs photographed & case-studied, ≥3 live trade relationships, pipeline ≥£60k. If installs slipped on capacity, accelerate the hiring trigger."}
  },
  {
    id:"p4", stamp:"PHASE 4", title:"Build the Machine", when:"Months 6–12",
    note:"Double down where the data says; prepare for the £400–500k workshop-subsidy cliff before it arrives.",
    tasks:[
      {id:"t41",who:"both",cost:"£1k cap",text:"Channel doubling-down by CAC data; paid ads tested only now — kill if CAC >8% of order value"},
      {id:"t42",who:"owner",cost:"£500–1,500 est.",text:"Display presence: open-workshop weekends and/or one regional show stand"},
      {id:"t43",who:"both",text:"Furniture line cut to 5 best sellers, made-to-order (bespoke exemption), published 4–6 wk lead time"},
      {id:"t44",who:"owner",text:"Hiring trigger: pipeline >8 carpenter-weeks/month for 3 months → recruit first dedicated maker"},
      {id:"t45",who:"claude",text:"The £400–500k plan: standalone workshop economics costed before they're needed"},
      {id:"t46",who:"both",text:"Year-1 review vs goal: run-rate, margin, pipeline → honest go / adjust decision"}
    ],
    gate:{id:"g4",text:"Run-rate ≥£350–450k with ≥40% project margins → on track for £250k profit in Year 3. Below £200k with the warm audience exhausted = strategy review, not more spend."}
  }
];

const REFS = [
  {id:"r1", title:"When things happen — quick answers", html:`<dl>
    <dt>Market research</dt><dd>Done (competitors). What remains is selling: the stock sale and consultation bookings are the demand test. Surveys: never.</dd>
    <dt>Website</dt><dd>One-pager in week 3; proper Shopify site weeks 6–12 — after brand and photography exist, never before.</dd>
    <dt>Photography</dt><dd>Weeks 3–4 (stock + workshop), then every install. The first £1k goes here.</dd>
    <dt>Brand / name</dt><dd>Decided weeks 1–2, executed weeks 6–8.</dd>
    <dt>Trade outreach</dt><dd>Months 3–6, once case studies exist. Don't waste the first impression on an empty portfolio.</dd>
    <dt>Paid ads</dt><dd>Month 6 at the earliest, £1k cap, only after warm channels work.</dd>
    <dt>Hiring</dt><dd>Trigger-based, not date-based: pipeline >8 carpenter-weeks/month for 3 consecutive months.</dd>
  </dl>`},
  {id:"r2", title:"Year-1 budget (all est.)", html:`
    <div class="budget-line"><span>Photography</span><span class="mono">£2,500–4,500</span></div>
    <div class="budget-line"><span>Brand</span><span class="mono">£300–800</span></div>
    <div class="budget-line"><span>Site & tools</span><span class="mono">£600–1,000</span></div>
    <div class="budget-line"><span>Print / outreach</span><span class="mono">£300</span></div>
    <div class="budget-line"><span>Shows / open days</span><span class="mono">£500–1,500</span></div>
    <div class="budget-line"><span>Ad test</span><span class="mono">£1,000</span></div>
    <div class="budget-line total"><span>Total, front-loaded ~£2k</span><span class="mono">≈ £5k–9k</span></div>
    <p style="margin-top:10px;color:var(--faded);font-size:13px">Ideally funded by Phase 1 stock sales.</p>`},
  {id:"r3", title:"Weekly rhythm", html:`<dl>
    <dt>Owner sends</dt><dd>Sales, enquiries, capacity used, blockers.</dd>
    <dt>Claude returns</dt><dd>Updated pipeline model, the week's drafts (emails, listings, proposals), and one honest flag if something is off-track.</dd>
  </dl>`}
];

/* ---------- state ---------- */
const KEY = "oak-launch-plan-v1";
let state = { checked:{}, gates:{}, openPhase:null, openRefs:{} };
let storageOK = false;
let saveTimer = null;
const $save = () => document.getElementById("saveState");

async function loadState(){
  // 1) Claude artifact storage (when opened inside claude.ai)
  if(typeof window.storage !== "undefined"){
    try{
      const r = await window.storage.get(KEY);
      if(r && r.value){ state = Object.assign(state, JSON.parse(r.value)); }
      storageOK = "artifact";
    }catch(e){
      try{ await window.storage.set(KEY, JSON.stringify(state)); storageOK = "artifact"; }
      catch(e2){ storageOK = false; }
    }
  }
  // 2) Browser localStorage (when hosted e.g. on GitHub Pages)
  if(!storageOK){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){ state = Object.assign(state, JSON.parse(raw)); }
      localStorage.setItem(KEY, JSON.stringify(state));
      storageOK = "local";
    }catch(e){ storageOK = false; }
  }
  if(storageOK){ $save().textContent = "Progress saved on this device"; }
  else{
    $save().textContent = "Saving unavailable — progress lasts this session only";
    $save().classList.add("warn");
  }
}
function scheduleSave(){
  if(!storageOK){ return; }
  $save().textContent = "Saving…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      const payload = JSON.stringify(state);
      if(storageOK === "artifact"){ await window.storage.set(KEY, payload); }
      else{ localStorage.setItem(KEY, payload); }
      $save().textContent = "Progress saved on this device";
    }catch(e){
      $save().textContent = "Save failed — changes may not persist";
      $save().classList.add("warn");
    }
  }, 450);
}

/* ---------- render ---------- */
const app = document.getElementById("app");
const nav = document.getElementById("phaseNav");

function phaseStats(p){
  const total = p.tasks.length + 1; // + gate
  let done = p.tasks.filter(t=>state.checked[t.id]).length;
  if(state.gates[p.gate.id]) done++;
  return {done,total};
}
function firstIncompletePhase(){
  for(const p of PLAN){ const s = phaseStats(p); if(s.done < s.total) return p.id; }
  return PLAN[PLAN.length-1].id;
}

function render(){
  const current = state.openPhase || firstIncompletePhase();

  // nav
  nav.innerHTML = "";
  PLAN.forEach(p=>{
    const s = phaseStats(p);
    const b = document.createElement("button");
    b.className = "chip" + (s.done===s.total ? " done" : "") + (p.id===current ? " current" : "");
    b.innerHTML = `${p.stamp.replace("PHASE ","P")} <small>${s.done}/${s.total}</small>`;
    b.setAttribute("aria-label", `${p.title}, ${s.done} of ${s.total} complete`);
    b.onclick = ()=>{ state.openPhase = p.id; render(); scheduleSave();
      document.getElementById(p.id).scrollIntoView({block:"start"}); };
    nav.appendChild(b);
  });

  // phases
  app.innerHTML = "";
  PLAN.forEach(p=>{
    const s = phaseStats(p);
    const el = document.createElement("section");
    el.className = "phase" + (p.id===current ? " open" : "") + (s.done===s.total ? " complete" : "");
    el.id = p.id;

    const pct = Math.round(100*s.done/s.total);
    el.innerHTML = `
      <button class="phase-head" aria-expanded="${p.id===current}">
        <span class="stamp">${p.stamp}${s.done===s.total ? " · PASSED" : ""}</span>
        <h2>${p.title}</h2>
        <div class="meta"><span class="when">${p.when}</span><span class="mini">${s.done}/${s.total}</span></div>
      </button>
      <div class="kerf" aria-hidden="true"><i style="width:${pct}%"></i></div>
      <div class="phase-body"></div>`;

    el.querySelector(".phase-head").onclick = ()=>{
      state.openPhase = (state.openPhase===p.id && el.classList.contains("open")) ? "__none__" : p.id;
      render(); scheduleSave();
    };

    const body = el.querySelector(".phase-body");
    const note = document.createElement("p");
    note.className = "phase-note"; note.textContent = p.note;
    body.appendChild(note);

    p.tasks.forEach(t=>{
      const row = document.createElement("button");
      row.className = "task" + (state.checked[t.id] ? " checked" : "");
      row.setAttribute("role","checkbox");
      row.setAttribute("aria-checked", !!state.checked[t.id]);
      row.innerHTML = `<span class="peg" aria-hidden="true"></span>
        <span class="txt"><p>${t.text}</p>
        <span class="tags"><span class="tag ${t.who}">${t.who.toUpperCase()}</span>${t.cost?`<span class="tag">${t.cost}</span>`:""}</span></span>`;
      row.onclick = ()=>{ state.checked[t.id] = !state.checked[t.id]; render(); scheduleSave(); };
      body.appendChild(row);
    });

    const g = document.createElement("div");
    g.className = "gate" + (state.gates[p.gate.id] ? " passed" : "");
    g.innerHTML = `<div class="glabel">GATE — MUST PASS BEFORE NEXT PHASE</div><p>${p.gate.text}</p>`;
    const gRow = document.createElement("button");
    gRow.className = "task" + (state.gates[p.gate.id] ? " checked" : "");
    gRow.setAttribute("role","checkbox");
    gRow.setAttribute("aria-checked", !!state.gates[p.gate.id]);
    gRow.innerHTML = `<span class="peg" aria-hidden="true"></span><span class="txt"><p>Gate passed</p></span>`;
    gRow.onclick = ()=>{ state.gates[p.gate.id] = !state.gates[p.gate.id]; render(); scheduleSave(); };
    g.appendChild(gRow);
    body.appendChild(g);

    app.appendChild(el);
  });

  // reference sections
  REFS.forEach(r=>{
    const el = document.createElement("section");
    el.className = "ref" + (state.openRefs[r.id] ? " open" : "");
    el.innerHTML = `
      <button class="ref-head" aria-expanded="${!!state.openRefs[r.id]}">
        <h3>${r.title}</h3><span class="arrow">▶</span>
      </button>
      <div class="ref-body">${r.html}</div>`;
    el.querySelector(".ref-head").onclick = ()=>{
      state.openRefs[r.id] = !state.openRefs[r.id]; render(); scheduleSave();
    };
    app.appendChild(el);
  });

  // overall
  let done=0,total=0;
  PLAN.forEach(p=>{ const s=phaseStats(p); done+=s.done; total+=s.total; });
  const pctAll = total? Math.round(100*done/total) : 0;
  document.getElementById("overallPct").textContent = pctAll + "%";
  document.getElementById("overallCount").textContent = `${done} / ${total} tasks`;
  document.getElementById("overallBar").style.width = pctAll + "%";
}

(async function init(){
  await loadState();
  render();
})();
</script>
</body>
</html>
