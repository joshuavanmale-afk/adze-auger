<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Ingrid</title>
<style>
:root{
  --bg:#0b0d10; --panel:rgba(14,15,17,.86); --ink:#E9E3D6; --faded:#9C9488; --accent:#D9A35B; --blood:#B0473A; --line:rgba(233,227,214,.14);
  --panelW:min(44vw, 520px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);overscroll-behavior:none;
  font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif}
canvas{position:fixed;inset:0;display:block;width:100vw;height:100vh;touch-action:none}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s ease}
#fade.on{opacity:1}

/* text panel: right side in landscape, bottom sheet in portrait */
#panel{position:fixed;top:0;right:0;bottom:0;width:var(--panelW);background:var(--panel);
  border-left:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:flex;flex-direction:column;
  padding:calc(22px + env(safe-area-inset-top)) calc(22px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) 24px}
@media (orientation:portrait){
  #panel{top:auto;left:0;width:auto;height:46vh;border-left:none;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    padding:18px calc(20px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
}
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:4px}
#where{font:600 11px/1 -apple-system,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--faded);margin-bottom:14px}
#text{font-size:17px;line-height:1.6;white-space:pre-line}
#text b{color:var(--blood);font-weight:700}
#text i{color:#CFC6B4}
#text .reveal{font:inherit;color:var(--accent);background:none;border:none;border-bottom:1px dashed var(--accent);
  padding:0;cursor:pointer;text-align:left}
#text .revealed{animation:appear .6s ease}
@keyframes appear{from{opacity:0}to{opacity:1}}
#choices{display:flex;flex-direction:column;gap:9px;margin-top:20px}
#choices button{font:inherit;font-size:16px;text-align:left;color:var(--ink);background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;transition:background .15s,border-color .15s}
#choices button:active{background:rgba(255,255,255,.12)}
#choices button.flash{border-color:var(--accent);background:rgba(217,163,91,.16)}
#choices button.restart{color:var(--accent)}
#text, #choices{animation:appear .5s ease}
#hint{position:fixed;left:calc(14px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));
  font:12px -apple-system,system-ui,sans-serif;color:var(--faded);pointer-events:none;max-width:calc(100vw - var(--panelW) - 28px)}
@media (orientation:portrait){ #hint{bottom:calc(46vh + 10px)} }

#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse at center, rgba(20,22,26,.55), rgba(5,6,8,.95));z-index:5;padding:24px}
#title h1{font-size:64px;letter-spacing:.04em;font-weight:400}
#title p{margin-top:10px;color:var(--faded);font-style:italic}
#title button{margin-top:28px;font:inherit;font-size:18px;color:#1b1309;background:var(--accent);border:none;border-radius:99px;padding:13px 30px;cursor:pointer}
#title button.secondary{margin-top:12px;background:none;color:var(--faded);border:1px solid var(--line);font-size:15px;padding:10px 22px}
.hidden{display:none!important}
</style>
</head>

function guessSet(name, prev) {
  const n = name.toLowerCase();
  if (/bedroom/.test(n)) return "bedroom";
  if (/neighbour/.test(n)) return "neighbours";
  if (/kitchen|father|mother|parents|confront|cottage/.test(n)) return "kitchen";
  if (/orange|glade|ingrid|accepted|rejected|drown/.test(n)) return "glade";
  if (/trial|witch|burn/.test(n)) return "pyre";
  if (/forest|lost|deeper|reconnect|dead end|attack|butcher|search party 2/.test(n)) return "forest";
  if (/search|edge/.test(n)) return "edge";
  if (/outside|villager/.test(n)) return "outside";
  return prev || "street";
}

/* Choices/links whose wording matches these also light up an object in the
   scene that can be tapped instead of the button. First match wins. */
const HOTSPOTS = [
  [/orange/i, "orange"], [/rifle|gun/i, "rifle"], [/creature|demon|rush in/i, "lady"],
  [/window/i, "window"], [/neighbour/i, "neighbourHouse"], [/bedroom/i, "bedroomDoor"],
  [/crowd|villagers/i, "crowd"], [/clip/i, "clip"],
  [/mother|mrs bech|bruise|console/i, "mother"], [/father|accuse/i, "father"],
  [/go inside|leave the house|return to the kitchen/i, "door"],

const unsupported = new Set();

function parseLink(inner) {

  const m = src.trim().match(/^\$(\w+)\s*(?:(is not|is)\s+(.+))?$/s);
  if (!m) { unsupported.add("condition: " + src); return true; }

  return esc(s).replace(/''([\s\S]+?)''/g, "<b>$1</b>").replace(/\/\/([\s\S]+?)\/\//g, "<i>$1</i>")
    .replace(/''|\/\//g, "");

/* =====================================================================
   2. 3D WORLD — one "set" per location, built from simple shapes.
   ===================================================================== */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 200);
camera.rotation.order = "YXZ";

let seed = 7;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const mats = {};
const M = (hex, emissive) => {
  const k = hex + "|" + (emissive || "");
  return mats[k] || (mats[k] = new THREE.MeshLambertMaterial({ color: hex, emissive: emissive || 0x000000, flatShading: true }));
};
function mesh(geo, mat, x = 0, y = 0, z = 0, parent) {

  if (parent) parent.add(m);
  return m;
}
const flickers = [], sways = [];

/* ---- props ---- */
function person(o = {}) {
  const g = new THREE.Group(), coat = M(o.coat || "#4a3b2e"), skin = M(o.skin || "#d6b596");
  if (o.skirt) mesh(new THREE.CylinderGeometry(0.2, 0.36, 0.95, 10), M(o.skirtColor || o.coat || "#5a4636"), 0, 0.475, 0, g);
  else {
    mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.78, 6), M(o.legs || "#2b2520"), -0.1, 0.39, 0, g);
    mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.78, 6), M(o.legs || "#2b2520"), 0.1, 0.39, 0, g);
  }
  mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.62, 10), coat, 0, 1.08, 0, g);
  const armL = mesh(new THREE.CylinderGeometry(0.055, 0.05, 0.6, 6), coat, -0.26, 1.07, 0, g); armL.rotation.z = 0.12;
  const armR = mesh(new THREE.CylinderGeometry(0.055, 0.05, 0.6, 6), coat, 0.26, 1.07, 0, g); armR.rotation.z = -0.12;
  mesh(new THREE.SphereGeometry(0.135, 14, 10), skin, 0, 1.55, 0, g);
  const hair = mesh(new THREE.SphereGeometry(0.142, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.9), M(o.hair || "#2e2218"), 0, 1.57, -0.015, g);
  if (o.longHair) mesh(new THREE.BoxGeometry(0.26, 0.32, 0.08), M(o.hair), 0, 1.42, -0.1, g);
  g.scale.setScalar((o.h || 1.75) / 1.75);

}
function lady() {
  const g = new THREE.Group(), robe = M("#e8e2d6"), skin = M("#cfcac2", "#1a1a18"), red = M("#8e1f1a");
  mesh(new THREE.CylinderGeometry(0.2, 0.5, 1.75, 12), robe, 0, 0.875, 0, g);
  mesh(new THREE.TorusGeometry(0.47, 0.025, 6, 24), red, 0, 0.18, 0, g).rotation.x = Math.PI / 2;
  mesh(new THREE.TorusGeometry(0.33, 0.02, 6, 24), red, 0, 0.9, 0, g).rotation.x = Math.PI / 2;
  mesh(new THREE.CylinderGeometry(0.18, 0.21, 0.5, 10), robe, 0, 1.95, 0, g);
  for (const s of [-1, 1]) {
    const arm = mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.95, 6), robe, s * 0.27, 1.75, 0, g); arm.rotation.z = s * -0.12;
    mesh(new THREE.SphereGeometry(0.06, 8, 6), skin, s * 0.33, 1.27, 0, g);
  }
  const head = mesh(new THREE.SphereGeometry(0.15, 14, 10), skin, 0, 2.38, 0, g); head.scale.set(0.85, 1.35, 0.9);
  mesh(new THREE.SphereGeometry(0.025, 6, 4), M("#000000"), -0.05, 2.43, 0.12, g);
  mesh(new THREE.SphereGeometry(0.025, 6, 4), M("#000000"), 0.05, 2.43, 0.12, g);

    const beam = (len, x, y, rz, parent) => {
      const b = mesh(new THREE.CylinderGeometry(0.018, 0.03, len, 5), antlerMat, x, y, 0, parent);

    beam(0.45, s * 0.38, 0.45, s * -0.25, a);
    beam(0.3, s * 0.52, 0.42, s * -1.2, a);
    beam(0.28, s * 0.3, 0.62, s * 0.35, a);

function pine(x, z, h, parent, rot) {
  const g = new THREE.Group(); g.position.set(x, 0, z);
  mesh(new THREE.CylinderGeometry(0.1 * h / 6, 0.2 * h / 6, h * 0.45, 6), rot ? M("#0e0c0b") : M("#3a2a1f"), 0, h * 0.225, 0, g);
  const green = M(rot ? "#1f2a1c" : "#1d3322");
  for (let k = 0; k < 3; k++) mesh(new THREE.ConeGeometry(h * (0.26 - k * 0.06), h * 0.42, 7), green, 0, h * (0.38 + k * 0.2), 0, g);

function oak(x, z, s, parent, trunkColor = "#4a3a2a", leaf = "#3f6b35") {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s);
  const t = mesh(new THREE.CylinderGeometry(0.22, 0.38, 2.6, 7), M(trunkColor), 0, 1.3, 0, g); t.rotation.z = (rand() - 0.5) * 0.25;

  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rotY;
  mesh(new THREE.BoxGeometry(w, 2.4, d), M(o.wall || "#6d5e4c"), 0, 1.2, 0, g);
  const tri = new THREE.Shape([new THREE.Vector2(-w / 2 - 0.35, 0), new THREE.Vector2(w / 2 + 0.35, 0), new THREE.Vector2(0, 1.6)]);
  const roof = mesh(new THREE.ExtrudeGeometry(tri, { depth: d + 0.5, bevelEnabled: false }), M(o.roof || "#3b2f26"), 0, 2.4, -d / 2 - 0.25, g);
  const door = mesh(new THREE.BoxGeometry(0.9, 1.8, 0.08), M("#2a1d14"), o.doorX || 0, 0.9, d / 2 + 0.03, g);
  const win = mesh(new THREE.BoxGeometry(0.7, 0.6, 0.08), M("#2a2015", o.lit ? "#c58a3c" : "#000000"), w / 2 - 0.8, 1.45, d / 2 + 0.03, g);
  parent.add(g);

function lantern(x, y, z, parent, power = 1.3) {
  const g = new THREE.Group(); g.position.set(x, y, z);
  mesh(new THREE.BoxGeometry(0.14, 0.2, 0.14), M("#3a2a14", "#ffb347"), 0, 0, 0, g);
  const l = new THREE.PointLight(0xffa64d, power, 9, 2); g.add(l);

const VILLAGER_COATS = ["#4a3b2e", "#3d4436", "#55453a", "#3a3a40", "#5c4a3a", "#43382f"];
function crowdGroup(n, cx, cz, r, a0, a1, parent, lanterns = 1, faceX = cx, faceZ = cz) {
  const g = new THREE.Group(); parent.add(g);
  for (let k = 0; k < n; k++) {
    const a = a0 + (a1 - a0) * (k + rand() * 0.5) / n, rr = r + (rand() - 0.5) * 1.2;

const $ = id => document.getElementById(id);
let current = null, currentSet = null, setTime = 0;
let activeHot = [];   // [{obj, marker, buttons}]
const marker = () => {
  const cv = document.createElement("canvas"); cv.width = cv.height = 64;
  const g = cv.getContext("2d");
  g.strokeStyle = "#ffd28a"; g.lineWidth = 6; g.beginPath(); g.arc(32, 32, 22, 0, Math.PI * 2); g.stroke();
  g.fillStyle = "#ffd28a"; g.beginPath(); g.arc(32, 32, 8, 0, Math.PI * 2); g.fill();
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false, transparent: true }));
  s.renderOrder = 10; s.scale.setScalar(0.45); return s;
};

function findPassage(target) {
  if (STORY.passages[target] != null) return target;
  const t = target.trim();
  return Object.keys(STORY.passages).find(n => n.trim() === t) || null;
}
function staging(name) {
  return STAGING[name] || STAGING[name.trim()] || [guessSet(name, currentSet && currentSet.name), []];
}

function showSet(name, cast, after) {
  const set = SETS[name] || SETS.street;
  const change = set !== currentSet;
  const apply = () => {
    for (const s of Object.values(SETS)) s.g.visible = s === set;
    for (const [tok, objs] of Object.entries(set.cast)) objs.forEach(o => o.visible = cast.includes(tok));
    scene.background = set.bg; scene.fog = new THREE.Fog(set.bg, set.fog[0], set.fog[1]);
    if (change) { setTime = 0; look.yaw = look.pitch = 0; }
    currentSet = set;
    $("where").textContent = set.label || "";
    if (after) after();
  };
  if (change && currentSet) {
    $("fade").classList.add("on");
    setTimeout(() => { apply(); $("fade").classList.remove("on"); }, 450);
  } else apply();
}

function goTo(target) {
  const name = findPassage(target);
  if (name == null) { alert(`Broken link: no passage called "${target}"`); return; }
  current = name;
  const snapshot = JSON.stringify(vars); // state on entry, so resuming replays this passage correctly
  try { localStorage.setItem("ingrid3d", JSON.stringify({ passage: name, vars: snapshot })); } catch (e) {}
  const [setName, cast] = staging(name);
  renderPassage(name);
  showSet(setName, cast, rebuildHot);
  $("scroll").scrollTop = 0;
}

function renderPassage(name) {
  const textEl = $("text"), choicesEl = $("choices");
  textEl.innerHTML = ""; choicesEl.innerHTML = "";
  textEl.style.animation = choicesEl.style.animation = "none"; void textEl.offsetWidth;
  textEl.style.animation = choicesEl.style.animation = "";
  clearHot();
  const nodes = parse(STORY.passages[name]);
  renderNodes(nodes, textEl, choicesEl);
  tidyWhitespace(textEl);
}
function renderNodes(nodes, into, choicesEl) {
  for (const n of nodes) {
    if (n.t === "text") into.insertAdjacentHTML("beforeend", markup(n.v));
    else if (n.t === "set") doSet(n.v);
    else if (n.t === "if") { if (evalCond(n.cond) !== n.neg) renderNodes(n.body, into, choicesEl); }
    else if (n.t === "link") {
      const b = document.createElement("button");
      b.textContent = n.label;
      if (/play again/i.test(n.label)) b.className = "restart";
      b.onclick = () => goTo(n.target);
      choicesEl.appendChild(b);
    } else if (n.t === "reveal") {
      const b = document.createElement("button");
      b.className = "reveal"; b.textContent = n.label;
      const run = () => {
        if (!b.isConnected) return;
        const span = document.createElement("span"); span.className = "revealed";
        b.replaceWith(span);
        const extra = document.createElement("div");
        renderNodes(n.body, span, extra);
        // links revealed inside a hook join the choices list
        [...extra.children].forEach(c => choicesEl.appendChild(c));
        tidyWhitespace(span);
        rebuildHot();
      };
      b.onclick = run;
      into.appendChild(b);
    }
  }
}
function tidyWhitespace(el) {
  // collapse the blank lines Harlowe source leaves behind (e.g. around (set:) lines),
  // editing text nodes in place so button handlers survive
  el.normalize();
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const texts = []; while (walker.nextNode()) texts.push(walker.currentNode);
  texts.forEach(t => t.nodeValue = t.nodeValue.replace(/[ \t]*\n[ \t]*/g, "\n").replace(/\n{3,}/g, "\n\n"));
  if (texts.length && el.id === "text") {
    texts[0].nodeValue = texts[0].nodeValue.replace(/^\s+/, "");
    texts[texts.length - 1].nodeValue = texts[texts.length - 1].nodeValue.replace(/\s+$/, "");
  }
}

/* tapping objects in the scene: every on-screen choice or (link:) whose wording
   matches HOTSPOTS gets a glowing marker on the matching object */
function clearHot() {
  for (const h of activeHot) scene.remove(h.marker);
  activeHot = [];
}
function visibleInScene(o) { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; }
function rebuildHot() {
  clearHot();
  if (!currentSet) return;
  const buttons = [...document.querySelectorAll("#text button.reveal, #choices button")];
  const byObj = new Map();
  for (const button of buttons) {
    const rule = HOTSPOTS.find(([re]) => re.test(button.textContent));
    const obj = rule && (currentSet.hot[rule[1]] || []).find(visibleInScene);
    if (!obj) continue;
    if (!byObj.has(obj)) byObj.set(obj, []);
    byObj.get(obj).push(button);
  }
  for (const [obj, buttons] of byObj) {
    const m = marker();
    const box = new THREE.Box3().setFromObject(obj), top = new THREE.Vector3();
    box.getCenter(top); top.y = box.max.y + 0.35;
    m.position.copy(top); scene.add(m);
    activeHot.push({ obj, marker: m, buttons });
  }
}

const raycaster = new THREE.Raycaster();
function tap(x, y) {
  if (!activeHot.length) return;
  raycaster.setFromCamera({ x: (x / innerWidth) * 2 - 1, y: -(y / innerHeight) * 2 + 1 }, camera);
  const targets = [];
  for (const h of activeHot) { targets.push(h.marker); h.obj.traverse(o => o.isMesh && targets.push(o)); }
  const hit = raycaster.intersectObjects(targets, false)[0];
  if (!hit) return;
  const owns = (h, o) => { let f = h.marker === o; h.obj.traverse(c => { if (c === o) f = true; }); return f; };
  const h = activeHot.find(h => owns(h, hit.object));
  if (!h) return;
  // a (link:) reveal only shows more text, so a tap can run it directly. Story choices
  // can't be undone, so a tap only highlights them and the player confirms in the panel.
  if (h.buttons.length === 1 && h.buttons[0].classList.contains("reveal")) { h.buttons[0].click(); return; }
  h.buttons[0].scrollIntoView({ behavior: "smooth", block: "nearest" });
  h.buttons.forEach(b => { b.classList.add("flash"); setTimeout(() => b.classList.remove("flash"), 1600); });
}

/* =====================================================================
   4. INPUT + LOOP
   ===================================================================== */
const look = { yaw: 0, pitch: 0 };
const ptrs = {};
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now() };
});
canvas.addEventListener("pointermove", e => {
  const p = ptrs[e.pointerId]; if (!p) return;
  look.yaw = Math.max(-1.3, Math.min(1.3, look.yaw - (e.clientX - p.x) * 0.004));
  look.pitch = Math.max(-0.5, Math.min(0.5, look.pitch - (e.clientY - p.y) * 0.004));
  p.x = e.clientX; p.y = e.clientY;
});
const endPtr = e => {
  const p = ptrs[e.pointerId]; if (!p) return; delete ptrs[e.pointerId];
  if (e.type === "pointerup" && Math.hypot(e.clientX - p.sx, e.clientY - p.sy) < 12 && performance.now() - p.t < 400) tap(e.clientX, e.clientY);
};
canvas.addEventListener("pointerup", endPtr);
canvas.addEventListener("pointercancel", endPtr);
document.addEventListener("gesturestart", e => e.preventDefault());

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w > h ? 55 : 75; // portrait is narrow, so widen the view to keep characters in frame
  // shift the picture so the action sits beside/above the text panel, not under it
  const panel = $("panel").getBoundingClientRect();
  if (w > h) camera.setViewOffset(w, h, panel.width / 2, 0, w, h);
  else camera.setViewOffset(w, h, 0, panel.height / 2 * 0.8, w, h);
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

let last = performance.now();
const tmpLook = new THREE.Vector3();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  setTime += dt;
  if (currentSet) {
    const c = currentSet.cam, k = 1 - Math.exp(-setTime / 18); // slow ease along the drift path
    camera.position.set(c.pos[0] + c.drift[0] * k, c.pos[1] + c.drift[1] * k + Math.sin(now / 1400) * 0.02, c.pos[2] + c.drift[2] * k);
    tmpLook.set(c.look[0], c.look[1], c.look[2]);
    const dir = tmpLook.sub(camera.position);
    const baseYaw = Math.atan2(-dir.x, -dir.z), basePitch = Math.atan2(dir.y, Math.hypot(dir.x, dir.z));
    camera.rotation.set(basePitch + look.pitch, baseYaw + look.yaw, 0);
  }
  for (const f of flickers) {
    const n = 0.85 + Math.sin(now / 90 + (f.base || 1) * 7) * 0.08 + Math.random() * 0.07;
    if (f.l) f.l.intensity = f.base * n;
    if (f.m) f.m.scale.y = 0.8 + n * 0.3;
  }
  for (const g of sways) g.rotation.z = Math.sin(now / 1300) * 0.015;
  for (const h of activeHot) h.marker.material.opacity = 0.55 + Math.sin(now / 280) * 0.45;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---- start ---- */
buildSets();
resize();
requestAnimationFrame(frame);
showSet("street", []);
let saved = null;
try { saved = JSON.parse(localStorage.getItem("ingrid3d") || "null"); } catch (e) {}
if (saved && STORY.passages[saved.passage] != null) $("resume").classList.remove("hidden");
$("begin").onclick = () => { $("title").classList.add("hidden"); vars = {}; goTo(STORY.start); };
$("resume").onclick = () => { $("title").classList.add("hidden"); vars = JSON.parse(saved.vars); goTo(saved.passage); };
if (unsupported.size) console.warn("Harlowe features not supported:", [...unsupported]);
window.__ingrid = { parse, goTo, get vars() { return vars; }, set vars(v) { vars = v; }, unsupported, get current() { return current; } };
</script>
</body>
