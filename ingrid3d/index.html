<style>
:root{
  --bg:#0b0d10; --panel:rgba(14,15,17,.86); --ink:#E9E3D6; --faded:#9C9488; --accent:#D9A35B; --blood:#B0473A; --line:rgba(233,227,214,.14);

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);overscroll-behavior:none;
  font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif}
canvas{position:fixed;inset:0;display:block;width:100vw;height:100vh;touch-action:none}

#fade.on{opacity:1}

/* text panel: right side in landscape, bottom sheet in portrait */
#panel{position:fixed;top:0;right:0;bottom:0;width:var(--panelW);background:var(--panel);
  border-left:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:flex;flex-direction:column;
  padding:calc(22px + env(safe-area-inset-top)) calc(22px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) 24px}
@media (orientation:portrait){
  #panel{top:auto;left:0;width:auto;height:46vh;border-left:none;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    padding:18px calc(20px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
}
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:4px}
#where{font:600 11px/1 -apple-system,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--faded);margin-bottom:14px}
#text{font-size:17px;line-height:1.6;white-space:pre-line}
#text b{color:var(--blood);font-weight:700}

#text .reveal{font:inherit;color:var(--accent);background:none;border:none;border-bottom:1px dashed var(--accent);
  padding:0;cursor:pointer;text-align:left}
#text .revealed{animation:appear .6s ease}
@keyframes appear{from{opacity:0}to{opacity:1}}
#choices{display:flex;flex-direction:column;gap:9px;margin-top:20px}
#choices button{font:inherit;font-size:16px;text-align:left;color:var(--ink);background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;transition:background .15s,border-color .15s}
#choices button:active{background:rgba(255,255,255,.12)}
#choices button.flash{border-color:var(--accent);background:rgba(217,163,91,.16)}
#choices button.restart{color:var(--accent)}
#text, #choices{animation:appear .5s ease}
#hint{position:fixed;left:calc(14px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));
  font:12px -apple-system,system-ui,sans-serif;color:var(--faded);pointer-events:none;max-width:calc(100vw - var(--panelW) - 28px)}
@media (orientation:portrait){ #hint{bottom:calc(46vh + 10px)} }

#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse at center, rgba(20,22,26,.55), rgba(5,6,8,.95));z-index:5;padding:24px}
#title h1{font-size:64px;letter-spacing:.04em;font-weight:400}
#title p{margin-top:10px;color:var(--faded);font-style:italic}
#title button{margin-top:28px;font:inherit;font-size:18px;color:#1b1309;background:var(--accent);border:none;border-radius:99px;padding:13px 30px;cursor:pointer}
#title button.secondary{margin-top:12px;background:none;color:var(--faded);border:1px solid var(--line);font-size:15px;padding:10px 22px}

  <p>Kaldhavn is starving.</p>
  <button id="begin">Begin</button>

<script>
/* The story itself is injected here by build.py from your Twine file. */
const STORY = /*STORY*/{"name": "Ingrid", "start": "Introduction", "passages": {"Introduction": "The town of Kaldhavn is starving\n\nAn unnatural rot has destroyed the harvest and strange figures have been seen in the forest.\n\nThe townsfolk fear they have been cursed.\n\nNeighbours turn on each other, throwing accusations of witchcraft. \n\nNone will walk alone after dark.\n\nAs the head of the Town Watch people look to you for answers. \n\nYou have none. \n\n[[Continue->Taken in the night]]\n\n(set: $VisitedBedroom to false)\n(set: $SpokentoFather to false)\n(set: $seenwindow to false)\n(set: $AngeredFather to false)\n(set: $FatherDead to false)", "Taken in the night": "Wiping sleep from your eyes, you follow a group frantic townsfolk through Kaldhavn's muddy streets. One lights the way with the steady glow of his lantern.\n\nIngrid, a young girl, has gone missing. She disappeared from her room in the night.\n\nYou are heading to her family home.\n\n[[Continue->A Outside]]", "A Outside": "You arrive at a small cottage on the outskirts of town. There are villagers gathered outside, engaged in panicked conversation. From inside you can hear someone weeping.\n\n(link: \"Ask the crowd what happened\")[\"Little Ingrid's been snatched in the night. We've searched the town but found nought.\" \n\n\"Taken by a demon or some witch I reckon. Stolen away for blood sacrifice.\"\n\nA dozen more theories are hurled your way, with very few facts among them]\n\n[[Go inside->A Kitchen]]", "A Kitchen": "You enter the cottage. The villagers wait outside, but watch you through the open front door.\n\nYou come into a small kitchen where a dark haired man paces like a caged animal. Ingrid's Father.\n\nFrom the kitchen there are two doors, each leading to a bedroom. Agonised weeping sounds from one of those doors.\n\nThe man sees you've entered and stops his pacing. He watches you cooly.\n\n[[Question Ingrid's Father->A Talking to the Father]]\n\n[[Ask if you can see Ingrids bedroom->A Bedroom]]", "A Talking to the Father": "You tell Ingrid's father that you have questions for him. You invite him to sit at the kitchen table, and he does so.\n\nAs you sit with him you smell strong alcohol. Mr Bech has been drinking. \n\nHe waits for your questions with a sour expression.\n\n(link: \"What happened?\")[//I found my daughters bed empty, that's what happened. You expect me to know how? Expect me to know where she's gone? Isn't that what you're here for Watchman?//]\n\n(link: \"Did you notice anything strange in the night?\")[//No.//]\n\n[[Accuse Ingrid's Father of Hiding Something->A thrown out]]\n\n(if: $VisitedBedroom is false) [[Ask if you can see Ingrids bedroom->A Bedroom]]\n\n[[Leave the House->A Outside 2]]\n\n(set: $SpokentoFather to true)\n\n", "A Bedroom": "You enter a childs bedroom. Everything is tidy. At first glance, there is no sign of struggle or forced entry. \n\nA woman lies across a small bed, her face buried in its pillows. She's weeping uncontrollably and doesn't notice you. \n\n(link: \"Try to console the mother\")[//\"Mrs Bech,\" you call softly. She doesn't reply. You gently touch her shoulder, but still get no response.\n\nNothing you do will get her attention.//]\n\n(link: \"Examine the window\")[//You inspect the window and find nothing out of place. Outside, you see neighbouring cottages. One has a window directly looking onto Ingrid's room. Perhaps they saw something. \n\nBeyond the cottages is the forest. Its dark pine trees sway with the wind. She could have climbed through but why would any little girl do such a thing?// (set: $seenwindow to true)]\n\n[[Return to the kitchen->A Kitchen return]]\n\n(if: $SpokentoFather is true) [[Leave the House->A Outside 2]]\n\n(set: $VisitedBedroom to true)", "A Kitchen return": "You return to the kitchen. Ingrid's father still paces back and forth.\n\nFrom outside you hear the anxious chatter of the villagers.\n\n[[Leave the House->A Outside 2]]\n\n(if: $SpokentoFather is false)[[Question Ingrid's Father->A Talking to the Father]]\n\n", "A Outside 2": "You leave the cottage to an avalanche of questions from the villagers waiting outside. Lacking any substantial leads, you need to act fast.\n\n(if: $seenwindow is true) [[Question the neighbours->A Neighbours]]\n(if: $seenwindow is false) [[Search outside Ingrid's window->A Neighbours 0.5]]\n", "A thrown out": "\"Hiding something?\" He snatches a bottle from the table and smashes it. \"I'll hide this in your gut,\" he says brandishing the smashed glass. \"Get out of my house.\" You stand and back away. The only option is to leave. \n\n[[Continue->A Outside 2]]\n\n(set: $AngeredFather to true)", "A Neighbours": "You go to the neighbouring cottage, and are quickly ushered in.\n\nThe window overlooking Ingrid's room belongs to another child. He lies on his mother's lap bundled in blankets. She shakes him awake as you enter. \n\nYou ask him if he saw anything. His bottom lip quivers and he shakes his head.\n\n\"Nothing will happen to you,\" his mother whispers. \"Tell him.\"\n\nHe stays mute a moment longer, then it all comes out. \"I saw little Ingrid Bech, jump out her window and run into the woods. She went all alone, and didn't look even back once.\"\n\n\"Bewitched,\" his mother mutters. \"I'm so sorry, I'd have come forward but he said it was just a nightmare.\" \n\n[[Tell the villagers what you've learned->A Speak to villagers]]\n\n[[Search for Ingrid alone->B Search alone]]\n\n(if: $AngeredFather is false) [[Tell Ingrids parents what you have learned->A Back to Cottage]]", "B Search alone": "The villagers are anxious. You call for calm. You assure them that you know where Ingrid has gone, you just need time. You return to the Bech Cottage and study the ground outside her windows. \n\nYou return to Ingrid's window and slowly walk towards the forest, studying the ground for anything that confirms the boys story.\n\nThe villagers watch you. \"He doesn't know what he's doing,\" you hear. \"Is he going into them woods alone? Think we'll be needing a new Watchman by morning.\"\n\nThe forest is ahead. Hunters have reported it empty. They say there's no game to be had for miles, yet as you approach you feel that something is watching.\n\nYou stop at the sight of a hair clip, dropped in the grass. The first sign of Ingrid. The boy had told the truth.\n\n[[Call the villagers->B Search party 1.5]]\n\n[[Continue alone->B Forest alone]]", "A Speak to villagers": "You call the villagers and announce your new findings. Ingrid ran into the forest alone. Heads turn to the ranks of towering pine trees. Just looking at the forest makes them fidget with unease. \n\n[[Call a search party->B Search party 1 1]]\n\n[[Call for Ingrids cottage to searched->A Searching the Cottage]]", "A Back to Cottage": "The villagers clamour to hear what you've learned, but they'll have to wait. You return to the cottage immediately, hurrying through the door. \n\nInside very little has changed. Ingrid's father sits at the kitchen table muttering to himself. You can no longer hear his wife crying but you can't see her either. Presumably she is still in the bedroom. \n\n[[Question Ingrid's Father alone->A Talking to the Father 2]]\n\n[[Ask him to get Ingrid's mother->A Talking to the parents]]\n\n", "B Search party 2": "There are no paths in the forest. Instead you must trudge through dried up bracken and dead shrubbery. The air stinks of mold and decay. By lantern light you make out a layer of black rot covering one of the trees.\n\nEach search part was instructed to hold the same course and stay within sight of one another.\n\nHowever, as you continue your group begins to drift away from the others. You feel the forest is guiding you away. It wants you to get lost.\n\n[[Continue deeper->B Deeper with group]]\n\n[[Try rejoin the neighbouring group->B Try to reconnect]]", "B Forest alone": "Without a lantern, compass or weapon, you decide to forge ahead. Even before reaching the trees you know that you've disapeared into the dark. The townsfolk can only guess where you are. \n\nPine trees loom overhead. You go press beyond the treeline. There are no paths in the forest, instead you trudge through dried up bracken and dead shrubbery. The air stinks of mold and decay.\n\nYou search the ground for signs of Ingrid, but you can barely make out you own feet.\n\n[[Continue deeper->B Lost 1]]\n\n[[Turn back->B Lost 2]]", "B Lost 1": "You forge deeper and deeper, though who's to say you aren't simply going in circles. You haven't the tools or the familiarity to tell. \n\nYou walk and walk but there's no sign of Ingrid. \n\nHours drag by and it becomes apparent that you have made a mistake. \n\nYou will not find Ingrid this way. What's more you have no idea how to get back to town. \n\n''You are lost in the forest.''\n\n[[Play again->Introduction]]", "B Lost 2": "But which way is back? You think you know. You turn around and start walking, but you walk for a long time and the trees show no sign of thinning. \n\nYou're lost. You stumble around in the dark but it's hopeless. Perhaps come morning, someone will come and find you, but there's no guarantee. \n\n''Ingrid's lost too. Alone in the forest. You have failed her.''\n\n[[Play again->Introduction]]", "B Search party 1 1": "You return to the Bech cottage where you organise the search party into a long row.\n \nAs a group, you edge towards the forest. Hunters have reported it empty, no game to be had for miles, yet as you approach you feel something is watching.\n\nSomeone calls out. They have found a small hair clip.\n\nIt is clear Ingrid passed this way and the villagers are determined to find her. \n\nYou arrange them into search parties, five people per group. \n\nYou march towards the forest with half the town at your heels.\n\n[[Continue->B Search party 2]]", "B Deeper with group": "You continue onwards, scanning the ground for any sign of Ingrid. As you do, the other groups drift further and further away. Eventually the light of their lanterns fade entirely. Your group is alone.\n\n[[Continue->B Dead end]]", "B Try to reconnect": "You try to close the gap, but as you walk towards the light of your neighbouring search party, they grow further and further away. \n\nEventually, you lose sight of them. Your group is alone. \n\n[[Continue->B Dead end]]", "B Dead end": "A member of your search party finds a set of tracks. He believes that two people recently passed through. \n\nYou follow the tracks for a while but the abruptly cut off. \"It's like they disappeared into thin air,\" the hunter says. \n\n\"Witchcraft,\" others mutter. \n\nIt seems you've come to a dead end and the other search parties are no where to be seen. \n\n(link: \"Call Ingrids Name\")[Your calls go unanswered. The forest throws back their echo almost mockingly. \n\nThe others join in calling for her, catching your desperation.] \n\nWith no more information you have come to a dead end. You march through the forest screaming her name, but the forest has no answers for you. \n\n''Ingrid is lost.''\n\n[[Play again->Introduction]]", "A Talking to the Father 2": "You rejoin Ingrid's Father at the table, and tell him that Ingrid left the house through the bedroom window unaccompanied. \n\n\"Nonesense,\" is all he says in reply.\n\n(link: \"Ask where she went\")[//\"There's not a child in this town, who'd go wandering after dark. Even half the adults are too afraid to. You're pulling this out your arse\"//]\n\n[[Accuse him of hiding something->A Confrontation]]\n\n[[Ask him to get Ingrid's mother->A Talking to the parents]]", "A Talking to the parents": "Reluctantly, Ingrid's Father rises from the table and heads into the bedroom. You hear them speaking in soft voices. \n\nHe returns, guiding his wife by the hand. She keeps her eyes on the ground. Her face is red and she snivels as she walks. There's a bruise under her left eye. \n\nThey both sit. \n\n(link: \"Ask Mrs Bech why Ingrid left\")[//\"'Mrs Bech tries to speak but can't get the words out. She just shakes her head. Perhaps she knows, but won't say\"//]\n\n(link: \"Ask about her bruise\")[//\"'Not a bruise,\" her husband says sharply. \"Its a rash. She had a reaction to something while out foraging a couple days ago. Likely that rot on the trees.\"//]\n\n[[Accuse them of hiding something->A Confrontation 2]]\n\n[[Ask them if they'll join you searching in the woods->B Into the woods with the family]]", "A Confrontation": "His nostrils flare. \"What are you saying? You come into my house and accuse me of... Of what? Killing my daughter? Or chasing her away? You think this is my fault?\"\n\nHe lunges forward with an empty spirit bottle and smashes it across your face. You fall back and he hits you again and again. The glass smashes, shards cutting your face.\n\nHearing the commotion, some of the villagers come and drag him off of you. \n\n''Serious damage has been done. There's blood everywhere. You need urgent treatment and will play no further part in finding Ingrid.\n''\n\n[[Play again->Introduction]]", "A Confrontation 2": "Mr Bech's nostrils flare, he stands from his seat but his wife grabs his arm. He breaks free and dives across the table aiming a punch at you. \n\nThough you flinch away, it clips your chin and you stagger backwards. Ingrids father mounts the table. He's about to dive on top of you but  several villagers charge into the cottage.\n\nThree men wrestle him to the floor and drag him outside, while a fourth helps you to your feet. \n\n[[Have Ingrid's Father removed and speak to the mother alone->A Talking to the Mother]]\n\n[[Ask the villagers to search the cottage->A Searching the Cottage]]", "B Into the woods with the family": "Ingrid's Father begins to grumble. \"No child would...\" \n\nYou cut him off. \"Perhaps she was bewitched.\" Rumours of dark magic surrounded the forest. Many claimed to have seen demonic figures amongst the trees. \n\nIt's a hard point for him to argue. He grimly nods his head. His wife agrees more readily. \n\nYou leave the cottage and join the villagers outside. \n\nYou ask for volunteers for a search party. At once, every hand shoots into the air. \n\n[[Continue->Into the woods with the family 2]]", "Into the woods with the family 2": "The forest is ahead. Hunters have reported it empty, no game to be had for miles, yet as you approach you feel something is watching.\n \nAs a group, you march closer until someone calls out. They have found a small hair clip.\n\nIt is clear Ingrid passed this way and the villagers are determined to find her. \n\nYou arrange them into search parties, five people per group. Wanting to keep an eye on them, you make sure that Ingrid's parents are with you.  \n\nYou enter the forest.\n\n[[Continue->B The Forest 1]]", "B The Forest 1": "There are no paths in the forest. Instead you must trudge through dried up bracken and dead shrubbery. The air stinks of mold and decay. By lantern light you make out a layer of black rot covering one of the trees.\n\nEach search party was instructed to hold the same course and stay within sight of one another.\n\nHowever, as you continue your group begins to drift away from the others. You feel the forest is guiding you away. It wants you to get lost.\n\n[[Continue deeper->B Deeper with parents]]\n\n[[Try rejoin the neighbouring group->B Try to reconnect with parents]]", "B Deeper with parents": "You continue onwards, scanning the ground for any sign of Ingrid. As you do, the other groups drift further and further away. Eventually the light of their lanterns fade entirely. Your group is alone.\n\n[[Continue->B Attack]]", "B Try to reconnect with parents": "You try to close the gap, but as you walk towards the light of your neighbouring search party, the distance only grows. \n\nEventually, you lose sight of them. Your group is alone. \n\n[[Continue->B Attack]]", "B Attack": "You've been weaving through pine trees for over an hour. A few times someone has spotted what could be tracks, but each time its lead to nothing;\n\nIt's been a while since you last glimpsed another search party. Whenever someone takes a step away from the group the forest seems to drag them away and they have to hurry back. \n\n\"A face!' someone yells and points into the darkness. There's nothing there. \n\nParanoia? You think so, until you see it yourself. A pale long face watching from between two trees. Branching antlers sprout from its head. Its gone in a second and you rub your eyes. Was it a sleep deprived hallucination or something real?\n\n[[Continue->B Attack 1.5]]\n\n\n", "B Attack 2": "You charge in to help. The antlered demon, sees you coming. She snarls and twists away from you so that Ingrid's Father is out of reach. \n\nOne of her powerful legs kicks out. Her foot connects with your chest and you reel backwards. You hit the ground wheezing. \n\nIngrid's Father screams, but only for a second. The demon cuts his throat then raises the blade above her head. She brings it down again and again. Gore splaters in every direction as she butchers him. All you can do is watch.\n\nThe demon lets his body fall, and her eyes set on you. She raises her blade and steps forward. You try to scramble away, but you're still winded from the kick. You barely move. \n\nIn seconds she'll be upon you, stabbing and slashing. You close your eyes, anticipating it. Nothing happens. The demon watches you for a moment, then looks to Ingrid's mother, the only member of your group who didn't run. \n\nThe creature turns away and disapears into the trees.\n\n[[Continue->B Forest with mother]]", "B Attack 3": "Ingrid's Father screams, but only for a second. The demon cuts his throat then raises the blade above her head. She brings it down again and again. Gore splaters in every direction as she butchers him. All you can do is watch.\n\nThe demon lets his body fall, and her eyes fix on you. She raises her blade and steps forward. You mean to back away but your legs are frozen with fear.\n\nIn seconds she'll be upon you, stabbing and slashing. You close your eyes, anticipating it. Nothing happens. The demon watches you for a moment, then looks to Ingrid's mother, the only member of your group who didn't run. \n\nThe creature turns away and disapears into the trees.\n\n[[Continue->B Forest with mother]]", "B Lost 3": "The demon raises its blade and hisses furiously. You've seen enough.\n\nYou turn and bolt, running faster than you've ever moved. \n\nYou hurtle through pine trees, sprinting until your lungs are on fire and legs are flooded with lactic acid. \n\nYou trip on fallen branch and fall to the ground. \n\nOthers ran too, but you can't see or hear any of them nearby. \n\nYou are alone in the forest. There's only one thing to do. Pick youself up, head back to town, and pray the demon doesn't come for you. But which way is town? You have no way of knowing. \n\nYou are a coward. You have abandoned Ingrid and are now hopelessly lost in the forest.\n\n[[Play again->Introduction]]", "B Butchered": "You sprint to the discarded rifle and snatch it from the ground. You aim at the demon as she brings her knife to Ingrid's Father's throat. \n\nShe sees you. As you pull the trigger she spins around, and shields herself with his body. Your bullet ruptures his chest and the demon disapears into thin air, leaving him to fall to the ground.\n\nWhere has she gone? You look around, ready to fire again, but can't see her anywhere.\n\nA branch snaps behind you. You try to turn but its too late. The demon grabs your hair and wrenches back your head. A sharp sting flashes across your throat. \n\nYou stagger forward, bringing a hand to your gullet. It's warm and wet. You look down at your fingers to see them soaked red.. You topple forwards. The forest floor rushes towards you.\n\nWith a thud you crash into the mud, choking, spluttering. The demon steps over you and approaches Ingrid's mother who stands paralysed. \n\nIt reaches for her hand and pulls her away, leading her into the trees.\n\n[[Play again->Introduction]]", "B Forest with mother": "You heart still races. The demon has left. You and Ingrid's mother are the only members of the search party who remain. She stares vacantly at her husband's corpse. Gathering yourself, you call her away from it. There will be time to grieve later, but now Ingrid is still missing. \n\n\"That thing's got Ingrid,\" she sniffles. \"I know it. It's cause of him,\" she points at her husband. \"His drinking got out of control. He scared Ingrid away.\"\n\n(link: \"Ask her about the demon\")[//\"I don't know what it is\" she says quietly. \"But Ingrid calls her The Lady. She thinks that they're friends. She's always going out into the forest and coming back with fruit that shouldn't grow here, even before the rot came. Oranges. Grapes. //]\n\n(link: \"Get the fallen rifle\")[//\"Don't. We'll never find her if you're armed. The forest won't let us. We'll end up lost. Or worse, that thing will come back and kill you. //]\n\n[[Ask Ingrids mother if she can find her daughter->B Forest with mother 2]]\n\n(set: $FatherDead to true)", "B Forest with mother 2": "You follow Ingrid's Mother as she walks in a direction seemingly picked at random.\n\nAs you wander aimlessly, through uniform trees, doubt festers in the back of your mind. How can you hope to find the demon when it left no trail? What will happen when you find it?\n\nIngrid's mother never back tracks. She doesn't pause thinking of where to go next. She walks assuredly, like she knows the way. \n\nIt grows warmer and the forest changes. Uniform pine trees give way to twisting oaks, the bare forest floor suddendly becomes alive with foliage, and the smell of rot fades from the air. You look over your shoulder and can't recognise the way you came. Its as if you've been transported to a different place. \n\nAhead you hear music. Reed pipes sweetly play. \n\n[[Continue->C Oranges]]", "C Oranges": "The reed pipe melody grows louder and the trees thin. You enter a glade as dawn begins to break over ahead. In the middle of the glade is a small pool and a white tree. Fat oranges sit amongst its leaves. \n\nAt the base of the tree sits the pale antlered woman, playing a set of read pipes. A little girl with blond hair sit next to her. Ingrid. \n\n[[Stand back and let Ingrid's mother lead->C Oranges 2]]\n\n[[Call Ingrid->C Oranges 2]]\n\n[[Attack the creature->C Butchered 2]]", "C Oranges 2": "Ingrid stands. She looks at you and her mother, then she looks down at the demon, still playing its reed pipes. \n\n\"Ingrid,\" he mother says softly. \"Please come here.\" \n\nIngrid shakes her head. \n\nThe music stops. The demon sets aside its pipes and holds out a hand. An orange falls from the tree and lands in its upturned palm.\n\nThe demon stands. She's staggeringly tall. Seven feet at least, but the branching antlers make her even more imposing.  Her skin is pale as ash and she wears white robes embroidered with intricate blood red patterns.\n\nThe demon approaches. and holds out the orange. It speaks in a language you have no hope of understanding. The words sound like water in a babbling brooke. She wants you to eat it. \n\n[[Accept the orange->C Accepted]]\n\n[[Reject the orange->C Rejected]]", "C Butchered 2": "You cannot leave little Ingrid to the demon. You rush forwards. \n\nThe demon watches you charge across the glade. A knife materialises in it its hand and it lazily throws it. \n\nThe blade arcs towards you, spinning end-over-end. You try to leap aside but the blade changes course midair, tracking you. It pierces your chest with a thump and you tumble forwards. \n\nFace down in the grass, your vision is obscured, but you can the demon speaking in a strange language. Her words sound like running water. You hear her leave the base of the tree and approach Ingrid's mother, but what happens next you do not know.\n\n''You lose consciouness.''\n\n[[Play again->Introduction]]", "C Rejected": "The fruit could be poisoned or tainted by dark magic. You refuse it with a thorough shake of your head.\n\nThe demon rolls her eyes. She extends the fruit to Ingrids mother instead. \n\n(link: \"Try to stop her from taking it\")[//You step in the way blocking Ingrid's mother from the demon. The demon hisses. She shoves you in the chest, effortlessly knocking you to the ground. //]\n\nIngrids mother takes the orange. She peels and eats it while the demon watches. When she's finished the demon speaks to her that strange language. To your shock, Ingrid's mother replies in the same tongue. \n\nThere is a back and forth between them and you are utterly lost as to what is said. Even Ingrid responds in the alien language. \n\nWhen they are done Ingrid's mother turns to you. \"We are going to stay here, with The Lady. If we go back to town, there will be questions and accusations. It's safer here.\"\n\n[[Accept their decision-> C Ingrid Remains 2]]\n\n[[Force them to return to town with you->C Drowned]]", "C Accepted": "The demon holds out the orange. You gingerly take it. She mimes for you to peel and eat it. Behind her Ingrid is nodding eagerly. \n\nYou peel the orange and split it. You eat half and give the rest to Ingrid's mother. \n\nJuice dribbles down your chin. Its sweeter than any fruit you ever eaten. The demon watches you chew, staying silent until its eaten. \n\nWhen you've swallowed she speak. Her words now make perfect sense. \"Ingrid wants to be here. She's safe here.\" \n\n\"You can't keep her,\" Ingrid's Mother says sternly. \n\n\"You can't make her leave,\" the demon replies. \"I won't let you.\"\n\n(link: \"Ask the creature what it is\")[//\"My name is Sáivee. I am one of the Cern's, a native of this land. Ingrid came to me to keep her safe. I promised to do this and I will do this. //]\n\n(if: $FatherDead is true) [[Ask if Ingrid can decide for herself->C Ingrid leaves]]\n\n(if: $FatherDead is false) [[Ask if Ingrid can decide for herself->C Ingrid stays]]", "C Ingrid leaves": "The demon considers you for a moment before nodding. She steps aside and ushers Ingrid forward. \n\n\"We can go home. Your Father can't hurt us anymore. It will just be me and you.\"\n\nIngrid looks back at the demon and notices the red stains on her clothes. \"It's true. He can't,\" she confirms.\n\n\"But...\"\n\n\"Ingrid, I love you. If you stay here we won't see each other again.\" \n\nIngrid's eyes fill with tears. \"OK mama.\" \n\nIngrid runs into her mothers embrace. She looks back at the demon. \"Thank you Sáivee, for looking after me.\"\n\nIt shrugs and walks back to the orange tree. \"The forest will take you home,\" it says. True enough as you leave the clearing and walk through the forest in minutes the familiar pines trees are surrounding you again. \n\nBefore long you spill out of the forest and town is back in sight. \n\n''You have found Ingrid and returned her home. ''\n\n[[Play again->Introduction]]", "C Ingrid stays": "The demon considers you for a moment before nodding. She steps aside and ushers Ingrid forward. \n\n\"It's safe here,\" Ingrid mumbles. \n\n\"How you know that? How can you trust this thing?\" \n\nThe demon's nostrils flare but she does nothing. \"Because she's nice. She gave us fruit when we were starving. She took me in when father tried to hurt me.\" \n\n\"You can stay here if you like,\" said the demon to Ingrid's mother. \"Is it really safe for you to go home?\"\n\nYou know what she's thinking. Accusations of witchcraft and consorting with demons. A return to Kaldhavn will lead to no end of problems. \n\nIngrid's mother turns to you. \"I'll stay. What choice do I have?\" \n\n(link: \"Try to disuade her\")[//\"People will call us witches, they'll blame us for the rot. If we go home we'll be burned before long. Then there's my husband. I don't want to see him again. It's best I stay here. //]\n\nYou concede that there is no life for her and her daughter back in Kaldhavn. You leave the glade and return to Kaldhavn. You have not brought Ingrid home, but you take comfort knowing she is safe.\n\n[[Play again->Introduction]]", " C Ingrid Remains 2": "You have no idea what was said or what future they could possibly have in the glade with this monsters, but you respect their decision. \n\nAs you leave you worry about what will happen to them. Did they really want to stay, or were they coerced by the demons dark magic. \n\nYou return to Kaldhavn alone and hope you've done the right thing.\n\n[[Play again->Introduction]]", "C Drowned": "You demand the Ingrid and her mother return with you to Kaldhavn. The demon hisses but you ignore it. \n\nYou lunge to grab Ingrids wrist. The demon catches you and drags you to the ground. Her strength is irresistible, and you're a rag doll in her hands. She pulls you towards the pool in middle of the glade.\n\nYou fight to free yourself but its no good. She forces your head into the water. Its ice cold on your skin. You scream and bubbles explode from your mouth. \n\nShe holds you down as black spots appear across your vision. You head grows light. You're sorry. You'll leave the glade and never come back. \n\n''Its too late. Water floods your lungs and you stop struggling. Your vision fades to black. ''\n\n[[Play again->Introduction]]", "A Searching the Cottage": "At your order, the villagers ransack the house. Ingrid's Mother buries her head in her arms. It's all too much.\n\nThey tear through every room, upturning furniture and pulling out draws. One of them finds a note. It's message is scrawled in messy handwriting. \"I've gone to stay with The Lady.\" \n\n\"The Lady!\" a villager exclaims. \"But she went into the woods. This must be a demon.\"\n\n\"They've thrown in with demons. Consorting with them that cursed us.\"\n\nAccusations fly like shrapnel. You've seen the villagers like this before. The curse has left them starving on tight rations. Any chance of lifting it sends them into frenzy\n\n[[Continue->D Trial]]", "A Talking to the Mother": "You sit back at the table with a hand on your throbbing jaw. You're tired of the games. You give a simple instruction, \"talk.\"\n\nOutside her husband struggles with the men who dragged him away. He shouts and swears. She stays quiet until he's firmly out of earshot. \n\n\"He's been out of control lately. He hit me a few days ago and her last night. She ran away.\" You ask where Ingrid went and she fidgets. \"Ingrid has a friend in the woods,\" but no one lives in the woods. Outside of town the island is uninhabited. \n\n[[Continue->A Talking to the Mother 2]]", "A Talking to the Mother 2": "People have been seeing strange figures in the forest. Many call them demons. If Ingrid has consorted with demons by law she must burn.\n\n\"She calls her friend The Lady. I don't know what it is but its not human. It gives her strange fruit that couldn't possibly grow here. Oranges, grapes, and the like. Ingrid says she has antlers. I know how it sounds but I promise, she's not a witch. She just wanted to get away from her father, that's all.\"\n\n[[Accuse Ingrid and her family of Witchcraft->D Trial]]\n\n[[Go into the forest with the mother to find Ingrid->A Reconciliation]]", "D Trial": "Ingrid's mother is dragged from the cottage by her hair while multiple villagers have taken to kicking her husband on the floor. \n\nOn the mainland there would be a trial, but there are no judges or juries on Kaldhavn. \n\nIf survive the night, Ingrids parents will be brought before the priest, who will undoubtedly sentence them to the pyre. \n\nYou could try and call for order but it would do no good.\n\nAlone, it will be impossible to find Ingrid but you can still try. Then again if she's truly a witch, why bother. \n\n[[Search for Ingrid alone->B Forest alone]]\n\n[[Abandon the search->D Burn the witch]]", "D Burn the witch": "Morning comes and Ingrid's parents are hauled before the priest. His verdict was never in doubt. The pyers stand ready.\n\nYou watch as the pair are bound to the stake and flames bloom at their feet. The smell of burning pine seaps into the air. Screams soon follow. \n\nIngrid remains somewhere in the woods. You don't know where exactly, but frankly you don't care.  \n\n[[Play again->Introduction]]", "A Neighbours 0.5": "You circle the house to inspect the outside of Ingrid's. You hope for tracks or any tell as to what happened. You find only hardened mud. There are some light marks in the dirt, and perhaps a better tracker than yourself might have made something of them. They're no use to you. \n\nTurning around you notice a window of the neighbouring house looks directly onto Ingrid's room. Could its occupant have seen something? \n\n[[Continue->A Neighbours]]", "B Search party 1.5": "You snatch the clip from the ground and call out as loud as you can, waving it in the air.\n\nOrange lanterns spill from town and float through the darkness. As they get closer you can see the people carrying them and more besides. Dozens of villagers have answered your call. \n\nYou show them clip and point to the forest. You know she's gone inside. \n\nThe villagers eye the trees nervously, but don't back down. You ask who will come with you into the forest and every single person volunteers.\n\n[[Continue->B Search party 2]]", "A Reconciliation": "You leave the cottage with Ingrid's mother and call the villagers to gather around. You tell them that Ingrid has been lured into the woods by a demon and ask for volunteers for a search party. \n\nThough the crowd's nerves are palpable, everyone raises their hand, including Ingrid's Father. \n\n\"I want to apologise. I lost my temper in there... My daughter's in that forest. You have to let me come.\"\n\nYou decide to leave the decision to Ingrid's mother. She considers it for a moment, before slowly nodding her head.\n\n[[Continue->Into the woods with the family 2]]", "B Attack 1.5": "\"Its that bitch,\" says Ingrid's father. \"She's coming for me.\"\n\nBefore you have a chance to ask what he's talking about, someone screams. You whirl around as a towering figure strides from the darkness. \n\nA pale antlered woman, at least seven feet tall approaches the group. A gun fires, but the shot misses. She disapears into thin air only to materialise behine Ingrids Father.\n\nThe horrorifying woman grabs his hair with one hand and raises a huge knife with the other. All around you, the group scatters. Those with weapons throw them down. You spot a fallen rifle.\n\n[[Do nothing->B Attack 3]]\n\n[[Rush in to help->B Attack 2]]\n\n[[Reach for the gun->B Butchered]]\n\n[[Flee->B Lost 3]]"}}/*END*/;

function guessSet(name, prev) {
  const n = name.toLowerCase();
  if (/bedroom/.test(n)) return "bedroom";
  if (/neighbour/.test(n)) return "neighbours";
  if (/kitchen|father|mother|parents|confront|cottage/.test(n)) return "kitchen";
  if (/orange|glade|ingrid|accepted|rejected|drown/.test(n)) return "glade";

  if (/forest|lost|deeper|reconnect|dead end|attack|butcher|search party 2/.test(n)) return "forest";
  if (/search|edge/.test(n)) return "edge";
  if (/outside|villager/.test(n)) return "outside";
  return prev || "street";
}

/* =====================================================================
   1. HARLOWE-LITE: runs the subset of Harlowe 3 this story uses —
   [[links]], (link:)[hooks], (set:), (if:) on hooks and links,
   ''bold'' and //italic//. Anything else is logged and skipped.
   ===================================================================== */
const unsupported = new Set();
let vars = {};

function matchClose(src, i, open, close) {
  let depth = 0, inStr = null;
  for (let k = i; k < src.length; k++) {
    const ch = src[k];
    if (open === "(" && (ch === '"' || ch === "'")) { if (inStr === ch) inStr = null; else if (!inStr) inStr = ch; continue; }
    if (inStr) continue;
    if (ch === open) depth++;
    else if (ch === close && --depth === 0) return k;
  }
  return -1;
}
function parseLink(inner) {
  let m;
  if ((m = inner.match(/^(.*)->(.*)$/s))) return { t: "link", label: m[1].trim(), target: m[2] };
  if ((m = inner.match(/^(.*?)<-(.*)$/s))) return { t: "link", label: m[2].trim(), target: m[1] };
  if ((m = inner.match(/^(.*)\|(.*)$/s))) return { t: "link", label: m[1].trim(), target: m[2] };
  return { t: "link", label: inner.trim(), target: inner };
}
function parse(src) {
  const out = []; let i = 0, text = "";
  const flush = () => { if (text) { out.push({ t: "text", v: text }); text = ""; } };
  // a changer like (if:) attaches to the hook or link right after it (spaces allowed, as in Harlowe)
  const takeAttached = () => {
    let k = i; while (src[k] === " " || src[k] === "\t") k++;
    if (src.startsWith("[[", k)) {
      const e = src.indexOf("]]", k);
      if (e > 0) { i = e + 2; return [parseLink(src.slice(k + 2, e))]; }
    }
    if (src[k] === "[") {
      const e = matchClose(src, k, "[", "]");
      if (e > 0) { i = e + 1; return parse(src.slice(k + 1, e)); }
    }
    return null;
  };
  while (i < src.length) {
    if (src.startsWith("[[", i)) {
      const e = src.indexOf("]]", i);
      if (e > 0) { flush(); out.push(parseLink(src.slice(i + 2, e))); i = e + 2; continue; }
    }
    if (src[i] === "(") {
      const m = /^\(([\w-]+):/.exec(src.slice(i, i + 40));
      const e = m ? matchClose(src, i, "(", ")") : -1;
      if (m && e > 0) {
        flush();
        const name = m[1].toLowerCase().replace(/-/g, ""), arg = src.slice(i + m[0].length, e).trim();
        i = e + 1;
        if (name === "set") { out.push({ t: "set", v: arg }); continue; }
        if (name === "if" || name === "unless") {
          const body = takeAttached() || [];
          out.push({ t: "if", cond: arg, neg: name === "unless", body }); continue;
        }
        if (name === "link") {
          const label = (arg.match(/^"(.*)"$|^'(.*)'$/s) || [])[1] ?? arg;
          out.push({ t: "reveal", label, body: takeAttached() || [] }); continue;
        }
        unsupported.add(name); takeAttached(); continue;
      }
    }
    text += src[i++];
  }
  flush();
  return out;
}
function literal(s) {
  s = s.trim();
  if (s === "true") return true;
  if (s === "false") return false;
  if (/^-?\d+(\.\d+)?$/.test(s)) return +s;
  const q = s.match(/^"(.*)"$|^'(.*)'$/s); if (q) return q[1] ?? q[2];
  if (s[0] === "$") return vars[s.slice(1)];
  unsupported.add("value: " + s); return s;
}
function evalCond(src) {
  const m = src.trim().match(/^\$(\w+)\s*(?:(is not|is)\s+(.+))?$/s);
  if (!m) { unsupported.add("condition: " + src); return true; }
  const v = vars[m[1]];
  if (!m[2]) return !!v;
  return m[2] === "is" ? v === literal(m[3]) : v !== literal(m[3]);
}
function doSet(src) {
  const m = src.match(/^\$(\w+)\s+to\s+(.+)$/s);
  if (m) vars[m[1]] = literal(m[2]); else unsupported.add("set: " + src);
}
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function markup(s) {
  return esc(s).replace(/''([\s\S]+?)''/g, "<b>$1</b>").replace(/\/\/([\s\S]+?)\/\//g, "<i>$1</i>")
    .replace(/''|\/\//g, "");
}

function person(o = {}) {

  s = makeSet("glade", { label: "The glade", sky: 0xffd9a8, groundLight: 0x3a4a2a, bg: "#d7a77a", fogNear: 10, fogFar: 48, hemi: 0.95,
    cam: { pos: [-1.5, 1.7, 6.5], look: [0.2, 1.3, -3], drift: [1.4, 0, -1.0] } });
  ground("#5a7a3a", 120, s.g);
  const sun = new THREE.DirectionalLight(0xffc88a, 0.7); sun.position.set(-10, 6, -12); s.g.add(sun);
  for (let k = 0; k < 34; k++) { const a = k / 34 * Math.PI * 2; oak(Math.cos(a) * (13 + rand() * 4), Math.sin(a) * (13 + rand() * 4) - 3, 1.2 + rand() * 0.6, s.g); }
  const pond = mesh(new THREE.CircleGeometry(1.7, 28), M("#3f6f8f", "#0e2433"), 3.2, 0.02, -1.6, s.g); pond.rotation.x = -Math.PI / 2;
  hot(s, "pool", pond);
  const tree = oak(0, -4.5, 1.25, s.g, "#e9e4da", "#5b8a3f");
  let hotOrange = null;
  for (let k = 0; k < 16; k++) {
    const o = mesh(new THREE.SphereGeometry(0.13, 10, 8), M("#f08a1c", "#5a2a00"), (rand() - 0.5) * 3, 3.4 + rand() * 1.3, -4.5 + (rand() - 0.5) * 2, s.g);
    if (!hotOrange) hotOrange = o;
  }
  const handOrange = mesh(new THREE.SphereGeometry(0.11, 10, 8), M("#f08a1c", "#5a2a00"), 0, 0, 0, null);
  const lg = lady(); lg.position.set(-0.9, -0.8, -3.6); lg.lookAt(0, -0.8, 5); castMember(s, "lady", lg, "lady");
  const pipes = mesh(new THREE.BoxGeometry(0.25, 0.12, 0.04), M("#c9a86a"), 0, 0.85, 0.3, lg);
  const lu = lady(); lu.position.set(0.2, 0, -1.6); lu.lookAt(-1.5, 0, 6.5); castMember(s, "ladyUp", lu, "lady");
  handOrange.position.set(0.33, 1.3, 0.25); lu.add(handOrange);
  hot(s, "orange", handOrange); hot(s, "orange", hotOrange);
  const ig = person(INGRID); ig.position.set(0.6, 0, -3.0); ig.lookAt(-1.5, 0, 6.5); castMember(s, "ingrid", ig, "ingrid");
  const mg = person(MOTHER); mg.position.set(-2.3, 0, 1.5); mg.lookAt(0, 0, -3); castMember(s, "mother", mg, "mother");

  // the pyre
  s = makeSet("pyre", { label: "Kaldhavn, morning", sky: 0x9aa0a8, bg: "#5d6168", fogNear: 8, fogFar: 45, hemi: 0.7,
    cam: { pos: [0, 1.8, 7.5], look: [0, 1.5, -4], drift: [0, 0, -1.5] } });
  ground("#3a3128", 100, s.g);
  for (let k = 0; k < 6; k++) cottage(-14 + k * 5.5, -14, 4, 4, 0, s.g);
  for (const x of [-1.3, 1.3]) {
    for (let k = 0; k < 7; k++) { const log = mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.6, 6), M("#4a3220"), x, 0.2 + (k % 2) * 0.15, -4, s.g); log.rotation.set(Math.PI / 2, k * 0.45, 0); }
    mesh(new THREE.CylinderGeometry(0.08, 0.08, 3.2, 6), M("#3a2818"), x, 1.6, -4.25, s.g);
    const bound = person(x < 0 ? FATHER : MOTHER); bound.position.set(x, 0.4, -4.05); s.g.add(bound);
    for (let k = 0; k < 4; k++) {
      const fl3 = mesh(new THREE.ConeGeometry(0.22, 0.9, 6), M("#ff7a1a", "#ff5a00"), x + (k - 1.5) * 0.3, 0.6, -3.7 + (k % 2) * 0.2, s.g);
      flickers.push({ m: fl3 });
    }
    const pl = new THREE.PointLight(0xff7a2a, 2.2, 12, 2); pl.position.set(x, 1.2, -3.2); s.g.add(pl); flickers.push({ l: pl, base: 2.2 });
  }
  crowdGroup(12, 0, -3.5, 5.5, Math.PI * 0.1, Math.PI * 0.9, s.g, 0, 0, -4);
  const priest = person({ coat: "#111111", legs: "#111111", h: 1.8 }); priest.position.set(0, 0, -1.6); priest.lookAt(0, 0, 8); s.g.add(priest);
}

/* =====================================================================
   3. PLAYER
   ===================================================================== */
const $ = id => document.getElementById(id);
let current = null, currentSet = null, setTime = 0;
let activeHot = [];   // [{obj, marker, buttons}]
const marker = () => {
  const cv = document.createElement("canvas"); cv.width = cv.height = 64;
  const g = cv.getContext("2d");
  g.strokeStyle = "#ffd28a"; g.lineWidth = 6; g.beginPath(); g.arc(32, 32, 22, 0, Math.PI * 2); g.stroke();
  g.fillStyle = "#ffd28a"; g.beginPath(); g.arc(32, 32, 8, 0, Math.PI * 2); g.fill();
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false, transparent: true }));
  s.renderOrder = 10; s.scale.setScalar(0.45); return s;
};

function findPassage(target) {
  if (STORY.passages[target] != null) return target;
  const t = target.trim();
  return Object.keys(STORY.passages).find(n => n.trim() === t) || null;
}
function staging(name) {
  return STAGING[name] || STAGING[name.trim()] || [guessSet(name, currentSet && currentSet.name), []];
}

function showSet(name, cast, after) {
  const set = SETS[name] || SETS.street;
  const change = set !== currentSet;
  const apply = () => {
    for (const s of Object.values(SETS)) s.g.visible = s === set;
    for (const [tok, objs] of Object.entries(set.cast)) objs.forEach(o => o.visible = cast.includes(tok));
    scene.background = set.bg; scene.fog = new THREE.Fog(set.bg, set.fog[0], set.fog[1]);
    if (change) { setTime = 0; look.yaw = look.pitch = 0; }
    currentSet = set;
    $("where").textContent = set.label || "";
    if (after) after();
  };
  if (change && currentSet) {
    $("fade").classList.add("on");
    setTimeout(() => { apply(); $("fade").classList.remove("on"); }, 450);
  } else apply();
}

function goTo(target) {
  const name = findPassage(target);
  if (name == null) { alert(`Broken link: no passage called "${target}"`); return; }
  current = name;
  const snapshot = JSON.stringify(vars); // state on entry, so resuming replays this passage correctly
  try { localStorage.setItem("ingrid3d", JSON.stringify({ passage: name, vars: snapshot })); } catch (e) {}
  const [setName, cast] = staging(name);
  renderPassage(name);
  showSet(setName, cast, rebuildHot);
  $("scroll").scrollTop = 0;
}

function renderPassage(name) {
  const textEl = $("text"), choicesEl = $("choices");
  textEl.innerHTML = ""; choicesEl.innerHTML = "";
  textEl.style.animation = choicesEl.style.animation = "none"; void textEl.offsetWidth;
  textEl.style.animation = choicesEl.style.animation = "";
  clearHot();
  const nodes = parse(STORY.passages[name]);
  renderNodes(nodes, textEl, choicesEl);
  tidyWhitespace(textEl);
}
function renderNodes(nodes, into, choicesEl) {
  for (const n of nodes) {
    if (n.t === "text") into.insertAdjacentHTML("beforeend", markup(n.v));
    else if (n.t === "set") doSet(n.v);
    else if (n.t === "if") { if (evalCond(n.cond) !== n.neg) renderNodes(n.body, into, choicesEl); }
    else if (n.t === "link") {
      const b = document.createElement("button");
      b.textContent = n.label;
      if (/play again/i.test(n.label)) b.className = "restart";
      b.onclick = () => goTo(n.target);
      choicesEl.appendChild(b);
    } else if (n.t === "reveal") {
      const b = document.createElement("button");
      b.className = "reveal"; b.textContent = n.label;
      const run = () => {
        if (!b.isConnected) return;
        const span = document.createElement("span"); span.className = "revealed";
        b.replaceWith(span);
        const extra = document.createElement("div");
        renderNodes(n.body, span, extra);
        // links revealed inside a hook join the choices list
        [...extra.children].forEach(c => choicesEl.appendChild(c));
        tidyWhitespace(span);
        rebuildHot();
      };
      b.onclick = run;
      into.appendChild(b);
    }
  }
}
function tidyWhitespace(el) {
  // collapse the blank lines Harlowe source leaves behind (e.g. around (set:) lines),
  // editing text nodes in place so button handlers survive
  el.normalize();
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const texts = []; while (walker.nextNode()) texts.push(walker.currentNode);
  texts.forEach(t => t.nodeValue = t.nodeValue.replace(/[ \t]*\n[ \t]*/g, "\n").replace(/\n{3,}/g, "\n\n"));
  if (texts.length && el.id === "text") {
    texts[0].nodeValue = texts[0].nodeValue.replace(/^\s+/, "");
    texts[texts.length - 1].nodeValue = texts[texts.length - 1].nodeValue.replace(/\s+$/, "");
  }
}

/* tapping objects in the scene: every on-screen choice or (link:) whose wording
   matches HOTSPOTS gets a glowing marker on the matching object */
function clearHot() {
  for (const h of activeHot) scene.remove(h.marker);
  activeHot = [];
}
function visibleInScene(o) { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; }
function rebuildHot() {
  clearHot();
  if (!currentSet) return;
  const buttons = [...document.querySelectorAll("#text button.reveal, #choices button")];
  const byObj = new Map();
  for (const button of buttons) {
    const rule = HOTSPOTS.find(([re]) => re.test(button.textContent));
    const obj = rule && (currentSet.hot[rule[1]] || []).find(visibleInScene);
    if (!obj) continue;
    if (!byObj.has(obj)) byObj.set(obj, []);
    byObj.get(obj).push(button);
  }
  for (const [obj, buttons] of byObj) {
    const m = marker();
    const box = new THREE.Box3().setFromObject(obj), top = new THREE.Vector3();
    box.getCenter(top); top.y = box.max.y + 0.35;
    m.position.copy(top); scene.add(m);
    activeHot.push({ obj, marker: m, buttons });
  }
}

const raycaster = new THREE.Raycaster();
function tap(x, y) {
  if (!activeHot.length) return;
  raycaster.setFromCamera({ x: (x / innerWidth) * 2 - 1, y: -(y / innerHeight) * 2 + 1 }, camera);
  const targets = [];
  for (const h of activeHot) { targets.push(h.marker); h.obj.traverse(o => o.isMesh && targets.push(o)); }
  const hit = raycaster.intersectObjects(targets, false)[0];
  if (!hit) return;
  const owns = (h, o) => { let f = h.marker === o; h.obj.traverse(c => { if (c === o) f = true; }); return f; };
  const h = activeHot.find(h => owns(h, hit.object));
  if (!h) return;
  // a (link:) reveal only shows more text, so a tap can run it directly. Story choices
  // can't be undone, so a tap only highlights them and the player confirms in the panel.
  if (h.buttons.length === 1 && h.buttons[0].classList.contains("reveal")) { h.buttons[0].click(); return; }
  h.buttons[0].scrollIntoView({ behavior: "smooth", block: "nearest" });
  h.buttons.forEach(b => { b.classList.add("flash"); setTimeout(() => b.classList.remove("flash"), 1600); });
}

/* =====================================================================
   4. INPUT + LOOP
   ===================================================================== */
const look = { yaw: 0, pitch: 0 };
const ptrs = {};
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now() };
});
canvas.addEventListener("pointermove", e => {
  const p = ptrs[e.pointerId]; if (!p) return;
  look.yaw = Math.max(-1.3, Math.min(1.3, look.yaw - (e.clientX - p.x) * 0.004));
  look.pitch = Math.max(-0.5, Math.min(0.5, look.pitch - (e.clientY - p.y) * 0.004));
  p.x = e.clientX; p.y = e.clientY;
});
const endPtr = e => {
  const p = ptrs[e.pointerId]; if (!p) return; delete ptrs[e.pointerId];
  if (e.type === "pointerup" && Math.hypot(e.clientX - p.sx, e.clientY - p.sy) < 12 && performance.now() - p.t < 400) tap(e.clientX, e.clientY);
};
canvas.addEventListener("pointerup", endPtr);
canvas.addEventListener("pointercancel", endPtr);
document.addEventListener("gesturestart", e => e.preventDefault());

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w > h ? 55 : 75; // portrait is narrow, so widen the view to keep characters in frame
  // shift the picture so the action sits beside/above the text panel, not under it
  const panel = $("panel").getBoundingClientRect();
  if (w > h) camera.setViewOffset(w, h, panel.width / 2, 0, w, h);
  else camera.setViewOffset(w, h, 0, panel.height / 2 * 0.8, w, h);
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

let last = performance.now();
const tmpLook = new THREE.Vector3();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  setTime += dt;
  if (currentSet) {
    const c = currentSet.cam, k = 1 - Math.exp(-setTime / 18); // slow ease along the drift path
    camera.position.set(c.pos[0] + c.drift[0] * k, c.pos[1] + c.drift[1] * k + Math.sin(now / 1400) * 0.02, c.pos[2] + c.drift[2] * k);
    tmpLook.set(c.look[0], c.look[1], c.look[2]);
    const dir = tmpLook.sub(camera.position);
    const baseYaw = Math.atan2(-dir.x, -dir.z), basePitch = Math.atan2(dir.y, Math.hypot(dir.x, dir.z));
    camera.rotation.set(basePitch + look.pitch, baseYaw + look.yaw, 0);
  }
  for (const f of flickers) {
    const n = 0.85 + Math.sin(now / 90 + (f.base || 1) * 7) * 0.08 + Math.random() * 0.07;
    if (f.l) f.l.intensity = f.base * n;
    if (f.m) f.m.scale.y = 0.8 + n * 0.3;
  }
  for (const g of sways) g.rotation.z = Math.sin(now / 1300) * 0.015;
  for (const h of activeHot) h.marker.material.opacity = 0.55 + Math.sin(now / 280) * 0.45;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---- start ---- */
buildSets();
resize();
requestAnimationFrame(frame);
showSet("street", []);
let saved = null;
try { saved = JSON.parse(localStorage.getItem("ingrid3d") || "null"); } catch (e) {}
if (saved && STORY.passages[saved.passage] != null) $("resume").classList.remove("hidden");
$("begin").onclick = () => { $("title").classList.add("hidden"); vars = {}; goTo(STORY.start); };
$("resume").onclick = () => { $("title").classList.add("hidden"); vars = JSON.parse(saved.vars); goTo(saved.passage); };
if (unsupported.size) console.warn("Harlowe features not supported:", [...unsupported]);
window.__ingrid = { parse, goTo, get vars() { return vars; }, set vars(v) { vars = v; }, unsupported, get current() { return current; } };
</script>
